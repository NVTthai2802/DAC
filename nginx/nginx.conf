worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Định nghĩa cụm upstream chứa 2 instances của Dashboard
    # Mặc định Nginx sử dụng thuật toán Round-Robin để cân bằng tải
    upstream dashboard_cluster {
        server dashboard-1:3000;
        server dashboard-2:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Chuyển tiếp toàn bộ traffic vào cụm dashboard
        location / {
            proxy_pass http://dashboard_cluster;
            
            # Giữ lại các headers gốc để Next.js nhận diện đúng client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cấu hình WebSocket (cần cho Next.js dev server và HMR, mặc dù đây là prod build)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
