# =============================================================================
# OCTOPARSE - Docker Compose (Phase 2: HA & SPOF Removal)
# =============================================================================

volumes:
  zookeeper-1-data:
  zookeeper-1-log:
  zookeeper-2-data:
  zookeeper-2-log:
  zookeeper-3-data:
  zookeeper-3-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-primary-data:
  postgres-replica-data:
  druid_shared:
  coordinator_var:
  broker_var:
  historical_var:
  middle_var:
  router_var:

networks:
  octoparse-net:
    driver: bridge

services:
  # ===========================================================================
  # 1. ZOOKEEPER ENSEMBLE (3 nodes HA)
  # ===========================================================================
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-1
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - octoparse-net

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-2
    restart: unless-stopped
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zookeeper-2-data:/var/lib/zookeeper/data
      - zookeeper-2-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - octoparse-net

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-3
    restart: unless-stopped
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zookeeper-3-data:/var/lib/zookeeper/data
      - zookeeper-3-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - octoparse-net

  # ===========================================================================
  # 2. KAFKA CLUSTER (3 Brokers HA)
  # ===========================================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-1
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # HA Configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 2
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - octoparse-net

  kafka-2:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-2
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # HA Configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - octoparse-net

  kafka-3:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-3
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # HA Configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 2
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - octoparse-net

  # ===========================================================================
  # 3. POSTGRESQL (Primary - Replica Streaming)
  # ===========================================================================
  postgres-primary:
    image: postgres:17
    container_name: postgres-primary
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: FoolishPassword
      POSTGRES_DB: druid
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid -d druid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - octoparse-net

  postgres-replica:
    image: postgres:17
    container_name: postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: FoolishPassword
      POSTGRES_DB: druid
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - octoparse-net

  # ===========================================================================
  # 4. DRUID CLUSTER
  # ===========================================================================
  coordinator:
    image: apache/druid:37.0.0
    container_name: coordinator
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    ports:
      - "8081:8081"
    command: ["coordinator"]
    env_file:
      - ./druid-setup/environment
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - octoparse-net

  broker:
    image: apache/druid:37.0.0
    container_name: broker
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8082:8082"
    command: ["broker"]
    env_file:
      - ./druid-setup/environment
    volumes:
      - broker_var:/opt/druid/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - octoparse-net

  historical:
    image: apache/druid:37.0.0
    container_name: historical
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8083:8083"
    command: ["historical"]
    env_file:
      - ./druid-setup/environment
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - octoparse-net

  middlemanager:
    image: apache/druid:37.0.0
    container_name: middlemanager
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      zookeeper-1:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8091:8091"
      - "8100-8105:8100-8105"
    command: ["middleManager"]
    environment:
      - DRUID_SINGLE_NODE_CONF=micro-quickstart
      - druid_worker_capacity=5
    env_file:
      - ./druid-setup/environment
    volumes:
      - druid_shared:/opt/shared
      - middle_var:/opt/druid/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - octoparse-net

  router:
    image: apache/druid:37.0.0
    container_name: router
    restart: unless-stopped
    depends_on:
      zookeeper-1:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8888:8888"
    command: ["router"]
    env_file:
      - ./druid-setup/environment
    volumes:
      - router_var:/opt/druid/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - octoparse-net

  # ===========================================================================
  # 5. PRODUCERS (6 pipelines) - trỏ về 3 Kafka Brokers (Scale x2)
  # ===========================================================================
  producer-gold-1:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-gold-1
    restart: unless-stopped
    command: ["python", "-u", "producer_gold.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "0", PRODUCER_TOTAL: "2" }
    networks: [octoparse-net]

  producer-gold-2:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-gold-2
    restart: unless-stopped
    command: ["python", "-u", "producer_gold.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "1", PRODUCER_TOTAL: "2" }
    networks: [octoparse-net]

  producer-silver:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-silver
    restart: unless-stopped
    command: ["python", "-u", "producer_silver.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094" }
    networks: [octoparse-net]

  producer-oil-1:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-oil-1
    restart: unless-stopped
    command: ["python", "-u", "oil-pipeline/producer_oil.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "0", PRODUCER_TOTAL: "2" }
    networks: [octoparse-net]

  producer-oil-2:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-oil-2
    restart: unless-stopped
    command: ["python", "-u", "oil-pipeline/producer_oil.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "1", PRODUCER_TOTAL: "2" }
    networks: [octoparse-net]

  producer-forex-1:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-forex-1
    restart: unless-stopped
    command: ["python", "-u", "producer_forex.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "0", PRODUCER_TOTAL: "2" }
    env_file: [ .env ]
    volumes: [ "./forex_request_log.json:/app/forex_request_log.json" ]
    networks: [octoparse-net]

  producer-forex-2:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-forex-2
    restart: unless-stopped
    command: ["python", "-u", "producer_forex.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "1", PRODUCER_TOTAL: "2" }
    env_file: [ .env ]
    volumes: [ "./forex_request_log.json:/app/forex_request_log.json" ]
    networks: [octoparse-net]

  producer-stock-1:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-stock-1
    restart: unless-stopped
    command: ["python", "-u", "producer_stock.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "0", PRODUCER_TOTAL: "2" }
    networks: [octoparse-net]

  producer-stock-2:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-stock-2
    restart: unless-stopped
    command: ["python", "-u", "producer_stock.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094", PRODUCER_INDEX: "1", PRODUCER_TOTAL: "2" }
    networks: [octoparse-net]

  producer-osint:
    build: { context: ., dockerfile: Dockerfile.producer }
    container_name: producer-osint
    restart: unless-stopped
    command: ["python", "-u", "osint-pipeline/producer_osint.py"]
    depends_on: { kafka-1: { condition: service_healthy }, kafka-2: { condition: service_healthy }, kafka-3: { condition: service_healthy } }
    environment: { KAFKA_BROKER: "kafka-1:29092,kafka-2:29093,kafka-3:29094" }
    networks: [octoparse-net]

  # ===========================================================================
  # 6. DASHBOARD CLUSTER (Load Balanced)
  # ===========================================================================
  dashboard-1:
    build: { context: ./dashboard, dockerfile: Dockerfile }
    container_name: dashboard-1
    restart: unless-stopped
    # Không expose port 3000 ra ngoài, chỉ dùng nội bộ
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DRUID_URL=http://router:8888
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - octoparse-net

  dashboard-2:
    build: { context: ./dashboard, dockerfile: Dockerfile }
    container_name: dashboard-2
    restart: unless-stopped
    # Không expose port 3000 ra ngoài, chỉ dùng nội bộ
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DRUID_URL=http://router:8888
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - octoparse-net

  # ===========================================================================
  # 7. NGINX LOAD BALANCER
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dashboard-1:
        condition: service_healthy
      dashboard-2:
        condition: service_healthy
    networks:
      - octoparse-net

  # ===========================================================================
  # 8. MONITORING (Phase 5)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - octoparse-net

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - octoparse-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - octoparse-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka-1:29092", "--kafka.server=kafka-2:29093", "--kafka.server=kafka-3:29094"]
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - octoparse-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://druid:FoolishPassword@postgres-primary:5432/druid?sslmode=disable"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - octoparse-net
